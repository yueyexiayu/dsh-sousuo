<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">原生工具不变，provider 有界处理</title><desc id="desc">密钥不进入对话或 Git；高级垂直工具默认关闭，需要时才显式开启。</desc><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#567f7e"/></marker></defs><rect x="1" y="1" width="1118" height="358" rx="24" fill="#f3faf8" stroke="#d3e7e0"/><text x="40" y="49" fill="#163d45" font-size="25" font-weight="700">原生工具不变，provider 有界处理</text><text x="40" y="81" fill="#56747a" font-size="15">工作方式示意 · 非实际界面截图</text><path d="M282 195h18" stroke="#567f7e" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="140" width="239" height="117" rx="16" fill="#fff" stroke="#bad7cd"/><rect x="56" y="155" width="24" height="24" rx="8" fill="#8fd9c0" opacity=".45"/><text x="64" y="172" fill="#174f4b" font-size="12" font-weight="700">1</text><text x="57" y="205" font-size="17" fill="#1c464e" font-weight="700">官方 Web 工具</text><text x="57" y="235" font-size="12" fill="#58777d" font-weight="400">沿用开关与官方呈现</text><path d="M549 195h18" stroke="#567f7e" stroke-width="2" marker-end="url(#arrow)"/><rect x="307" y="140" width="239" height="117" rx="16" fill="#fff" stroke="#bad7cd"/><rect x="323" y="155" width="24" height="24" rx="8" fill="#8fd9c0" opacity=".45"/><text x="331" y="172" fill="#174f4b" font-size="12" font-weight="700">2</text><text x="324" y="205" font-size="17" fill="#1c464e" font-weight="700">本轮 Key 候选</text><text x="324" y="235" font-size="12" fill="#58777d" font-weight="400">只在402时轮换，最多一轮</text><path d="M816 195h18" stroke="#567f7e" stroke-width="2" marker-end="url(#arrow)"/><rect x="574" y="140" width="239" height="117" rx="16" fill="#fff" stroke="#bad7cd"/><rect x="590" y="155" width="24" height="24" rx="8" fill="#8fd9c0" opacity=".45"/><text x="598" y="172" fill="#174f4b" font-size="12" font-weight="700">3</text><text x="591" y="205" font-size="17" fill="#1c464e" font-weight="700">AnySearch HTTP</text><text x="591" y="235" font-size="12" fill="#58777d" font-weight="400">55秒预算，不绕已配置代理</text><rect x="841" y="140" width="239" height="117" rx="16" fill="#fff" stroke="#bad7cd"/><rect x="857" y="155" width="24" height="24" rx="8" fill="#8fd9c0" opacity=".45"/><text x="865" y="172" fill="#174f4b" font-size="12" font-weight="700">4</text><text x="858" y="205" font-size="17" fill="#1c464e" font-weight="700">来源或明确错误</text><text x="858" y="235" font-size="12" fill="#58777d" font-weight="400">真实截断与失败不冒充空结果</text><text x="41" y="308" font-size="14" fill="#3a6369" font-weight="400">密钥不进入对话或 Git；高级垂直工具默认关闭，需要时才显式开启。</text></g></svg>
